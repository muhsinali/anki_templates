<!-- Disable automated zoom onto cursor on mobile devices -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<!-------- Card Content, Hint, Tags and URL -------->
<div class="content_aligned">
    <!------- Content and Hint ------->
    {{Front}}

    <br>
    {{#Hint}}
    <br>

    <div id="hint" class="shown">
        <p class="payload">{{Hint}}</p>
    </div>
    {{/Hint}}

    {{#Back}}
        <!-- Only add horizontal rule if Back is not empty -->
        <hr>
    {{/Back}}

    {{Back}}
    <br>
</div>



<!------- Tags and URL ------->
<div id="content_tag_left" class="tag"></div>
<div id="url_container">{{URL}}</div>



<!-------- JavaScript -------->
<script>
    "use strict";
    // Common functions
// parse a space delimited tag string, and displays tags in sorted order in #content_tag_left
function displayTags(tagsString) {
    const tags = tagsString.split(" ").filter((tag) => tag.trim() !== "");
    const prettifiedTags = tags
        .map(prettifyTag)
        .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" }))
        .join(", ");
    const content_tag = document.getElementById("content_tag_left");
    if (content_tag)
        content_tag.textContent = prettifiedTags;
}
// converts "Computing::Machine_Learning" to "Computing - Machine Learning"
function prettifyTag(tag) {
    return tag.split("::").join(" - ").replace(/_/g, " ");
}
// render the optional URL field as a compact source link
function setLinkText() {
    const container = document.getElementById("url_container");
    if (!container)
        return;
    const anchor = container.querySelector("a");
    if (anchor) {
        anchor.textContent = "Link";
        return;
    }
    const rawUrl = container.textContent?.trim() ?? "";
    if (!/^https?:\/\//i.test(rawUrl))
        return;
    let parsedUrl;
    try {
        parsedUrl = new URL(rawUrl);
    }
    catch {
        return;
    }
    if (parsedUrl.protocol !== "http:" && parsedUrl.protocol !== "https:")
        return;
    const link = document.createElement("a");
    link.href = rawUrl;
    link.textContent = "Link";
    container.textContent = "";
    container.append(link);
}

    // Back template specific functions
// normalizes smart quotes and strips all whitespace
function parseInput(str) {
    return str.replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/\s+/g, "");
}
// removes the feedback inserted by a previous grading pass
function removeAnswerFeedback(input) {
    const nextElement = input.nextElementSibling;
    if (nextElement?.classList.contains("answer-feedback")) {
        nextElement.remove();
    }
}
// shows a non-color grading marker and, for wrong answers, the learner's attempt
function showAnswerFeedback(input, isCorrect, rawAttempt) {
    removeAnswerFeedback(input);
    const feedback = document.createElement("span");
    feedback.className = `answer-feedback ${isCorrect ? "answer-correct" : "answer-wrong"}`;
    feedback.textContent = isCorrect
        ? "Correct"
        : rawAttempt
            ? `Incorrect (you typed: ${rawAttempt})`
            : "Incorrect";
    input.insertAdjacentElement("afterend", feedback);
}
// displays each input as correct or wrong based on whether the normalized answer matches expected
function revealAnswer(data) {
    document.querySelectorAll("input").forEach((input) => {
        const inputName = input.name;
        // Skip empty inputs
        if (inputName) {
            const trueAnswer = inputName;
            const rawAttempt = data[inputName] ?? "";
            const expected = parseInput(trueAnswer);
            const actual = parseInput(rawAttempt);
            const isCorrect = actual === expected;
            input.classList.remove("answer-correct", "answer-wrong");
            input.classList.add(isCorrect ? "answer-correct" : "answer-wrong");
            input.style.backgroundColor = "";
            input.style.fontWeight = "";
            input.value = trueAnswer;
            input.readOnly = true;
            input.setAttribute("aria-label", isCorrect ? "Correct answer" : "Incorrect answer");
            showAnswerFeedback(input, isCorrect, rawAttempt);
        }
    });
}
// checks that stored front-side data belongs to the inputs on this back side
function inputSignatureMatches(data) {
    const currentInputNames = Array.from(document.querySelectorAll("input"))
        .map((input) => input.name)
        .filter((inputName) => inputName !== "");
    return (currentInputNames.length === data.inputNames.length &&
        currentInputNames.every((inputName, index) => inputName === data.inputNames[index]));
}
// back template initialization
function initializeBackTemplate() {
    if (window.data && inputSignatureMatches(window.data)) {
        revealAnswer(window.data.values);
    }
    displayTags("{{Tags}}");
    setLinkText();
}
// Initialize when loaded
initializeBackTemplate();

</script>
