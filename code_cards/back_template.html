<!-- Keep mobile browsers from zooming into answer inputs. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<div class="content_aligned">
    {{Front}}

    <br>
    {{#Hint}}
    <br>

    <div id="hint" class="shown">
        <p class="payload">{{Hint}}</p>
    </div>
    {{/Hint}}

    {{#Back}}
        <!-- Keep the separator out of cards that only have front-side answers. -->
        <hr>
    {{/Back}}

    {{Back}}
    <br>
</div>

<div id="content_tag_left" class="tag"></div>
<div id="url_container">{{URL}}</div>

<script>
    "use strict";
    function displayTags(tagsString) {
    const tagContainer = document.getElementById("content_tag_left");
    if (!tagContainer)
        return;
    tagContainer.textContent = formatTags(tagsString);
}
function formatTags(tagsString) {
    const tags = tagsString.split(" ").filter((tag) => tag.trim() !== "");
    return tags
        .map(prettifyTag)
        .sort(compareTags)
        .join(", ");
}
function compareTags(left, right) {
    return left.localeCompare(right, undefined, { sensitivity: "base" });
}
function prettifyTag(tag) {
    return tag.split("::").join(" - ").replace(/_/g, " ");
}
function setLinkText() {
    const container = document.getElementById("url_container");
    if (!container)
        return;
    const existingLink = container.querySelector("a");
    if (existingLink) {
        existingLink.textContent = "Link";
        return;
    }
    const rawUrl = container.textContent?.trim() ?? "";
    if (!isHttpUrl(rawUrl))
        return;
    replaceTextWithSourceLink(container, rawUrl);
}
function isHttpUrl(rawUrl) {
    if (!/^https?:\/\//i.test(rawUrl))
        return false;
    try {
        const parsedUrl = new URL(rawUrl);
        return parsedUrl.protocol === "http:" || parsedUrl.protocol === "https:";
    }
    catch {
        return false;
    }
}
function replaceTextWithSourceLink(container, rawUrl) {
    const link = document.createElement("a");
    link.href = rawUrl;
    link.textContent = "Link";
    container.textContent = "";
    container.append(link);
}

    function parseInput(str) {
    return str.replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/\s+/g, "");
}
function removeAnswerFeedback(input) {
    const nextElement = input.nextElementSibling;
    if (nextElement?.classList.contains("answer-feedback")) {
        nextElement.remove();
    }
}
function showAnswerFeedback(input, isCorrect, rawAttempt) {
    removeAnswerFeedback(input);
    const feedback = document.createElement("span");
    feedback.className = `answer-feedback ${isCorrect ? "answer-correct" : "answer-wrong"}`;
    feedback.textContent = answerFeedbackText(isCorrect, rawAttempt);
    input.insertAdjacentElement("afterend", feedback);
}
function answerFeedbackText(isCorrect, rawAttempt) {
    if (isCorrect)
        return "Correct";
    return rawAttempt ? `Incorrect (you typed: ${rawAttempt})` : "Incorrect";
}
function revealAnswer(values) {
    namedInputs().forEach((input, index) => revealInputAnswer(input, values[index]));
}
function revealInputAnswer(input, storedAttempt) {
    const expectedAnswer = input.name;
    // Missing and non-string entries both grade as an empty attempt — the
    // store crosses the webview as runtime state, so don't trust its entries
    const rawAttempt = typeof storedAttempt === "string" ? storedAttempt : "";
    const isCorrect = parseInput(rawAttempt) === parseInput(expectedAnswer);
    input.classList.remove("answer-correct", "answer-wrong");
    input.classList.add(isCorrect ? "answer-correct" : "answer-wrong");
    input.style.backgroundColor = "";
    input.style.fontWeight = "";
    input.value = expectedAnswer;
    input.readOnly = true;
    input.setAttribute("aria-label", isCorrect ? "Correct answer" : "Incorrect answer");
    showAnswerFeedback(input, isCorrect, rawAttempt);
}
function namedInputs() {
    return Array.from(document.querySelectorAll("input")).filter((input) => input.name !== "");
}
// window.data lives in Anki's long-lived webview, so the back can see a value
// written by an older template version (or any other script); validate the
// shape at runtime before trusting the compile-time contract. Older contracts
// (a flat name→value record, or record-shaped values) fail the array checks
// and skip grading instead of crashing.
function isCardInputData(value) {
    if (typeof value !== "object" || value === null)
        return false;
    return ("values" in value &&
        "inputNames" in value &&
        Array.isArray(value.values) &&
        Array.isArray(value.inputNames));
}
function inputSignatureMatches(data) {
    const currentInputNames = namedInputs().map((input) => input.name);
    return (currentInputNames.length === data.inputNames.length &&
        currentInputNames.every((inputName, index) => inputName === data.inputNames[index]));
}
function initializeBackTemplate() {
    const data = window.data;
    if (isCardInputData(data) && inputSignatureMatches(data)) {
        revealAnswer(data.values);
    }
    displayTags("{{Tags}}");
    setLinkText();
}
initializeBackTemplate();

</script>
