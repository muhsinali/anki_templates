<!-- Keep mobile browsers from zooming into answer inputs. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<div class="content_aligned">
    {{Front}}

    <br>

    {{#Hint}}
    <br>
    <div id="hint" class="hidden">
        <p class="trigger">Click to show hint</p>
        <p class="payload">{{Hint}}</p>
    </div>
    {{/Hint}}
</div>

<div id="content_tag_left" class="tag"></div>
<div id="url_container">{{URL}}</div>

<script>
    "use strict";
    function displayTags(tagsString) {
    const tagContainer = document.getElementById("content_tag_left");
    if (!tagContainer)
        return;
    tagContainer.textContent = formatTags(tagsString);
}
function formatTags(tagsString) {
    const tags = tagsString.split(" ").filter((tag) => tag.trim() !== "");
    return tags
        .map(prettifyTag)
        .sort(compareTags)
        .join(", ");
}
function compareTags(left, right) {
    return left.localeCompare(right, undefined, { sensitivity: "base" });
}
function prettifyTag(tag) {
    return tag.split("::").join(" - ").replace(/_/g, " ");
}
function setLinkText() {
    const container = document.getElementById("url_container");
    if (!container)
        return;
    const existingLink = container.querySelector("a");
    if (existingLink) {
        existingLink.textContent = "Link";
        return;
    }
    const rawUrl = container.textContent?.trim() ?? "";
    if (!isHttpUrl(rawUrl))
        return;
    replaceTextWithSourceLink(container, rawUrl);
}
function isHttpUrl(rawUrl) {
    if (!/^https?:\/\//i.test(rawUrl))
        return false;
    try {
        const parsedUrl = new URL(rawUrl);
        return parsedUrl.protocol === "http:" || parsedUrl.protocol === "https:";
    }
    catch {
        return false;
    }
}
function replaceTextWithSourceLink(container, rawUrl) {
    const link = document.createElement("a");
    link.href = rawUrl;
    link.textContent = "Link";
    container.textContent = "";
    container.append(link);
}

    function placeCursor() {
    document.querySelector("input")?.focus();
}
function setInputAttributes() {
    getInputs().forEach(disableMobileTypingAssists);
}
function getInputs() {
    return document.querySelectorAll("input");
}
function disableMobileTypingAssists(input) {
    input.setAttribute("autocapitalize", "off");
    input.setAttribute("autocomplete", "off");
    input.setAttribute("autocorrect", "off");
    input.setAttribute("spellcheck", "false");
}
function setupDOMContentLoaded(callback) {
    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", callback);
        return;
    }
    callback();
}
function setupEnterKeyEvent() {
    if (window.enterKeyHandlerBound)
        return;
    const handleEnterKey = (event) => {
        if (!shouldFlipCard(event))
            return;
        event.preventDefault();
        window.pycmd?.("ans");
    };
    document.addEventListener("keydown", handleEnterKey);
    window.enterKeyHandlerBound = true;
}
function shouldFlipCard(event) {
    return event.key === "Enter" && !event.isComposing;
}
function setupHint() {
    const hint = document.getElementById("hint");
    if (!hint)
        return;
    const revealHint = () => {
        hint.className = "shown";
    };
    hint.addEventListener("touchstart", revealHint);
    hint.addEventListener("mousedown", revealHint);
}
function storeInput() {
    // Null prototype so prototype-clashing input names ("__proto__",
    // "constructor") store and read back as plain own properties.
    const values = Object.create(null);
    const data = { values, inputNames: [] };
    getInputs().forEach((input) => rememberInput(data, input));
    return data;
}
function rememberInput(data, input) {
    const inputName = input.name;
    if (!inputName)
        return;
    data.inputNames.push(inputName);
    data.values[inputName] = input.value;
    input.addEventListener("input", () => {
        data.values[inputName] = input.value;
    });
}
function initializeFrontTemplate() {
    window.data = storeInput();
    setupDOMContentLoaded(function () {
        setInputAttributes();
        placeCursor();
    });
    setupHint();
    setupEnterKeyEvent();
    displayTags("{{Tags}}");
    setLinkText();
}
initializeFrontTemplate();

</script>
