<!-- Keep mobile browsers from zooming into answer inputs. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<div class="content_aligned">
    {{Front}}

    <br>
    {{#Hint}}
    <br>

    <div id="hint" class="shown">
        <p class="payload">{{Hint}}</p>
    </div>
    {{/Hint}}

    {{#Back}}
        <!-- Keep the separator out of cards that only have front-side answers. -->
        <hr>
    {{/Back}}

    {{Back}}
    <br>
</div>

<div id="content_tag_left" class="tag"></div>
<div id="url_container">{{URL}}</div>

<script>
    "use strict";
    %COMMON_JS%
    %TEMPLATE_JS%
</script>
