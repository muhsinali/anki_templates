name: CI

on:
  push:
  pull_request:

# The workflow only reads the repo; don't hand it the default write token
permissions:
  contents: read

# Cancel superseded runs of the same branch/PR (keyed by event so push and
# pull_request runs don't cancel each other)
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # Version-agnostic job name: branch protection requires this check by
    # name, so it must not churn when the Node line moves.
    name: checks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Track the Node 26 major line (matches .nvmrc and engines >=26)
          # so CI picks up 26.x security patches automatically.
          node-version: "26"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install dependencies
        run: npm ci

      - name: Install pre-commit
        run: python -m pip install "pre-commit>=4,<5"

      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure --color=always

      - name: Type-check source (the build never type-checks)
        run: npx tsc -p tsconfig.json --noEmit

      - name: Type-check tests and scripts
        run: npx tsc -p tsconfig.jest.json --noEmit

      - name: Run tests (with enforced coverage thresholds)
        run: npm test -- --coverage

      - name: Build templates
        run: npm run build

      - name: Verify committed code_cards/ matches src/ (no drift)
        run: git diff --exit-code code_cards/

      # A Mermaid syntax error doesn't fail anything on its own — GitHub just
      # renders an error box. Render every diagram block so that can't ship.
      - name: Cache mmdr binary
        id: cache-mmdr
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/mmdr
          key: mmdr-0.3.0-${{ runner.os }}

      - name: Install mmdr (Rust Mermaid renderer)
        if: steps.cache-mmdr.outputs.cache-hit != 'true'
        run: cargo install mermaid-rs-renderer --version 0.3.0 --locked

      - name: Check architecture diagrams render
        run: npx ts-node scripts/check-diagrams.ts
