repos:
  # Built-in hooks for file formatting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Type-check and run tests before commit
  - repo: local
    hooks:
      - id: typecheck
        name: TypeScript type-check
        entry: bash -c 'npx tsc -p tsconfig.json --noEmit && npx tsc -p tsconfig.jest.json --noEmit'
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: jest-tests
        name: Run Jest tests
        entry: npm test
        language: system
        pass_filenames: false
        stages: [pre-commit]
